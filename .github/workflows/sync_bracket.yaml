name: Sync Bracket MMPL S9

on:
  schedule:
    - cron: "0 13,16 * * *"   # every 15 minutes during active final stage
  workflow_dispatch:           # allow manual trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch bracket from Challonge
        env:
          CHALLONGE_API_KEY: ${{ secrets.CHALLONGE_API_KEY }}
        run: python sync_final.py

      - name: Commit final_bracket.json if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add final_bracket.json
          git diff --cached --quiet || git commit -m "Auto update final_bracket.json"
          git push
