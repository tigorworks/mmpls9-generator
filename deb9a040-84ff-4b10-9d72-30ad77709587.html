<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMPL S9 - MVP Input</title>
<style>

*, *::before, *::after {
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #0a0f1e;
  color: #e2e8f0;
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 40px 16px;
}

.card {
  width: 100%;
  max-width: 560px;
  background: #111827;
  border: 1px solid #1e293b;
  border-radius: 16px;
  padding: 32px 28px;
}

.card-header {
  margin-bottom: 28px;
}

.card-header h2 {
  font-size: 18px;
  font-weight: 700;
  color: #f59e0b;
  letter-spacing: .5px;
  text-transform: uppercase;
  margin: 0 0 4px;
}

.card-header p {
  font-size: 13px;
  color: #4b5563;
  margin: 0;
}

.field {
  margin-bottom: 16px;
}

.field label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: #6b7280;
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-bottom: 6px;
}

input,
select,
textarea {
  display: block;
  width: 100%;
  min-width: 0;
  padding: 10px 14px;
  border-radius: 8px;
  border: 1px solid #1e293b;
  background: #0d1424;
  color: #e2e8f0;
  font-size: 14px;
  font-family: inherit;
  transition: border-color .15s, box-shadow .15s;
  outline: none;
}

input:focus,
select:focus,
textarea:focus {
  border-color: #f59e0b;
  box-shadow: 0 0 0 3px rgba(245,158,11,.1);
}

input:disabled,
select:disabled,
textarea:disabled {
  opacity: .35;
  cursor: not-allowed;
}

input[type="date"] {
  display: block;
  width: 100%;
  min-width: 0;
  -webkit-appearance: none;
  appearance: none;
}

input[type="date"]::-webkit-calendar-picker-indicator {
  filter: invert(.4);
  cursor: pointer;
  flex-shrink: 0;
}

select {
  appearance: none;
  -webkit-appearance: none;
  padding-right: 38px;
  background-image: url("data:image/svg+xml;utf8,<svg fill='%236b7280' height='16' viewBox='0 0 20 20' width='16' xmlns='http://www.w3.org/2000/svg'><path d='M5 8l5 5 5-5' stroke='%236b7280' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat: no-repeat;
  background-position: right 12px center;
  cursor: pointer;
}

select:not(:disabled):hover {
  border-color: #374151;
}

textarea {
  min-height: 80px;
  resize: vertical;
}

.divider {
  height: 1px;
  background: #1e293b;
  margin: 24px 0;
}

.submit-btn {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: none;
  background: #f59e0b;
  color: #0a0f1e;
  font-size: 14px;
  font-weight: 700;
  font-family: inherit;
  letter-spacing: .3px;
  cursor: pointer;
  transition: background .15s, opacity .15s;
}

.submit-btn:hover:not(:disabled) {
  background: #fbbf24;
}

.submit-btn:disabled {
  background: #1e293b;
  color: #374151;
  cursor: not-allowed;
}

#debug {
  margin-top: 12px;
  font-size: 13px;
  color: #6b7280;
  text-align: center;
  min-height: 20px;
}

#debug.ok  { color: #34d399; }
#debug.err { color: #f87171; }
#debug.loading { color: #6b7280; }

/* ── Grand Final toggle switch ── */
.po-switch { display: block; cursor: pointer; user-select: none; }
.po-switch input[type="checkbox"] { display: none; }
.po-switch-pill {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  background: #0d1829;
  border: 1px solid #1f2f4a;
  border-radius: 10px;
  transition: background .2s, border-color .2s, box-shadow .25s;
}
.po-switch input:checked ~ .po-switch-pill {
  background: rgba(245,158,11,.07);
  border-color: rgba(245,158,11,.45);
  box-shadow: 0 0 14px rgba(245,158,11,.1);
}
.po-switch-track {
  width: 42px; height: 24px;
  background: #1f2f4a;
  border: 1px solid #2e4470;
  border-radius: 12px;
  position: relative;
  transition: background .2s, border-color .2s;
  flex-shrink: 0;
}
.po-switch-track::after {
  content: '';
  position: absolute;
  width: 18px; height: 18px;
  background: #374151;
  border-radius: 50%;
  top: 2px; left: 2px;
  transition: transform .2s, background .2s;
  box-shadow: 0 1px 3px rgba(0,0,0,.5);
}
.po-switch input:checked ~ .po-switch-pill .po-switch-track {
  background: rgba(245,158,11,.22);
  border-color: rgba(245,158,11,.55);
}
.po-switch input:checked ~ .po-switch-pill .po-switch-track::after {
  transform: translateX(18px);
  background: #f59e0b;
}
.po-switch-info { display: flex; flex-direction: column; gap: 2px; }
.po-switch-title { font-size: 13px; font-weight: 600; color: #e2e8f0; line-height: 1.3; }
.po-switch-desc { font-size: 11px; color: #4b5563; line-height: 1.3; }

/* ── Rating + points preview ── */
.mvp-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  align-items: center;
}
.rating-input { margin-top: 8px; }
.pts-preview {
  margin-top: 6px;
  font-size: 12px;
  color: #6b7280;
  min-height: 18px;
  transition: color .15s;
}
.pts-preview.ready { color: #f59e0b; font-weight: 600; }
.pts-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: rgba(245,158,11,.12);
  color: #f59e0b;
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 13px;
  font-weight: 700;
  margin-right: 6px;
}
.pts-formula { color: #4b5563; font-size: 11px; }

/* ── password gate ── */
#gate {
  width: 100%;
  max-width: 360px;
  background: #111827;
  border: 1px solid #1e293b;
  border-radius: 16px;
  padding: 36px 28px;
  text-align: center;
}

#gate h2 {
  font-size: 16px;
  font-weight: 700;
  color: #f59e0b;
  letter-spacing: .5px;
  text-transform: uppercase;
  margin-bottom: 6px;
}

#gate p {
  font-size: 13px;
  color: #4b5563;
  margin-bottom: 24px;
}

#gateInput {
  width: 100%;
  padding: 11px 14px;
  border-radius: 8px;
  border: 1px solid #1e293b;
  background: #0d1424;
  color: #e2e8f0;
  font-size: 15px;
  font-family: inherit;
  text-align: center;
  letter-spacing: 3px;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
  margin-bottom: 12px;
}

#gateInput:focus {
  border-color: #f59e0b;
  box-shadow: 0 0 0 3px rgba(245,158,11,.1);
}

#gateBtn {
  width: 100%;
  padding: 11px;
  border-radius: 8px;
  border: none;
  background: #f59e0b;
  color: #0a0f1e;
  font-size: 14px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: background .15s;
}

#gateBtn:hover { background: #fbbf24; }

#gateErr {
  margin-top: 10px;
  font-size: 13px;
  color: #f87171;
  min-height: 18px;
}

/* ── TABS ── */
.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 24px;
  background: #0d1424;
  border: 1px solid #1e293b;
  border-radius: 10px;
  padding: 4px;
}

.tab-btn {
  flex: 1;
  padding: 9px 8px;
  border-radius: 7px;
  border: none;
  background: transparent;
  color: #4b5563;
  font-size: 13px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: .4px;
  transition: all .15s;
}

.tab-btn:hover:not(.active) { color: #94a3b8; }

.tab-btn.active {
  background: #f59e0b;
  color: #0a0f1e;
}

.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── STAGE BADGE (playoff) ── */
.stage-info {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
}

.stage-info label {
  font-size: 12px;
  font-weight: 600;
  color: #6b7280;
  text-transform: uppercase;
  letter-spacing: .5px;
}

.stage-badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .3px;
}

.stage-badge.upper      { background: rgba(59,130,246,.15); color: #60a5fa; }
.stage-badge.lower      { background: rgba(139,92,246,.15); color: #a78bfa; }
.stage-badge.grand_final{ background: rgba(245,158,11,.15); color: #f59e0b; }

/* ── PLAYOFF LOADING / ERROR ── */
.po-state {
  padding: 24px 0;
  text-align: center;
  font-size: 13px;
  color: #4b5563;
}

.po-state.err { color: #f87171; }

</style>
</head>

<body>

<!-- password gate -->
<div id="gate">
  <h2>MVP Input</h2>
  <p>Enter password to continue</p>
  <input type="password" id="gateInput" placeholder="••••••••••" autocomplete="off">
  <button id="gateBtn">Enter</button>
  <div id="gateErr"></div>
</div>

<!-- form (tersembunyi sampai password benar) -->
<div class="card" id="formCard" style="display:none;">

  <div class="card-header">
    <h2>Input MVP</h2>
    <p>Fill in MVP data for each match</p>
  </div>

  <!-- Tab navigation -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="group" onclick="switchTab('group')">Group Stage</button>
    <button class="tab-btn"        data-tab="playoff" onclick="switchTab('playoff')">Playoff</button>
  </div>

  <!-- ── TAB: GROUP STAGE ─────────────────────── -->
  <div id="tab-group" class="tab-panel active">

    <div class="field">
      <label>Date</label>
      <input type="date" id="tanggal">
    </div>

    <div class="field">
      <label>Group</label>
      <select id="group">
        <option value="">Select Group</option>
      </select>
    </div>

    <div class="field">
      <label>Match</label>
      <select id="match" disabled>
        <option value="">Select Match</option>
      </select>
    </div>

    <div class="field">
      <label>Winner</label>
      <select id="winner" disabled>
        <option value="">Select Winner</option>
      </select>
    </div>

    <div class="field">
      <label>Stage</label>
      <select id="stage">
        <option value="lower">Lower Bracket</option>
        <option value="upper">Upper Bracket</option>
      </select>
    </div>

    <div class="divider"></div>

    <div class="field">
      <label>MVP Winner</label>
      <select id="mvpWinner" disabled>
        <option value="">Select Player</option>
      </select>
      <input type="number" id="ratingWinner" class="rating-input" min="8.0" max="15.0" step="0.1" placeholder="Rating MVP Winner (8.0 – 15.0)" disabled>
      <div id="ptsWinner" class="pts-preview">— pilih player & masukkan rating</div>
    </div>

    <div class="field">
      <label>MVP Loser</label>
      <select id="mvpLoser" disabled>
        <option value="">Select Player</option>
      </select>
      <input type="number" id="ratingLoser" class="rating-input" min="8.0" max="15.0" step="0.1" placeholder="Rating MVP Loser (8.0 – 15.0)" disabled>
      <div id="ptsLoser" class="pts-preview">— pilih player & masukkan rating</div>
    </div>

    <div class="field">
      <label>Notes <span style="color:#374151;font-weight:400;text-transform:none">(optional)</span></label>
      <textarea id="note" placeholder="Add a note..."></textarea>
    </div>

    <button id="submitBtn" class="submit-btn" disabled>Submit</button>
    <div id="debug"></div>

  </div><!-- /tab-group -->

  <!-- ── TAB: PLAYOFF ─────────────────────────── -->
  <div id="tab-playoff" class="tab-panel">

    <div class="field">
      <label>Date</label>
      <input type="date" id="po-tanggal">
    </div>

    <!-- Loading / error states -->
    <div id="po-loading" class="po-state">Loading bracket data…</div>
    <div id="po-error"   class="po-state err" style="display:none"></div>

    <!-- Playoff form (shown after data loaded) -->
    <div id="po-form" style="display:none">

      <div class="field">
        <label>Match</label>
        <select id="po-match">
          <option value="">Select Match</option>
        </select>
      </div>

      <!-- Auto stage (shown after match selected) -->
      <div class="stage-info" id="po-stage-info" style="display:none">
        <label>Stage (auto)</label>
        <span class="stage-badge" id="po-stage-badge"></span>
      </div>

      <!-- Grand Final override (shown after match selected) -->
      <div class="field" id="po-gf-field" style="display:none">
        <label class="po-switch" id="po-gfToggle">
          <input type="checkbox" id="po-grandFinal">
          <span class="po-switch-pill">
            <span class="po-switch-track"></span>
            <span class="po-switch-info">
              <span class="po-switch-title">Grand Final</span>
              <span class="po-switch-desc">override stage → +3 pts</span>
            </span>
          </span>
        </label>
      </div>

      <div class="field">
        <label>Winner</label>
        <select id="po-winner" disabled>
          <option value="">Select Winner</option>
        </select>
      </div>

      <div class="divider"></div>

      <div class="field">
        <label>MVP Winner</label>
        <select id="po-mvpWinner" disabled>
          <option value="">Select Player</option>
        </select>
        <input type="number" id="po-ratingWinner" class="rating-input" min="8.0" max="15.0" step="0.1" placeholder="Rating MVP Winner (8.0 – 15.0)" disabled>
        <div id="po-ptsWinner" class="pts-preview">— pilih player & masukkan rating</div>
      </div>

      <div class="field">
        <label>MVP Loser</label>
        <select id="po-mvpLoser" disabled>
          <option value="">Select Player</option>
        </select>
        <input type="number" id="po-ratingLoser" class="rating-input" min="8.0" max="15.0" step="0.1" placeholder="Rating MVP Loser (8.0 – 15.0)" disabled>
        <div id="po-ptsLoser" class="pts-preview">— pilih player & masukkan rating</div>
      </div>

      <button id="po-submitBtn" class="submit-btn" disabled>Submit</button>
      <div id="po-debug"></div>

    </div><!-- /po-form -->

  </div><!-- /tab-playoff -->

</div>

<script>

// ── password gate ──────────────────────────────────────────────
const _now = new Date();
const _yyyy = _now.getFullYear();
const _mm   = String(_now.getMonth() + 1).padStart(2, "0");
const _dd   = String(_now.getDate()).padStart(2, "0");
const PASSWORD = "mafiabagan" + _yyyy + _mm + _dd;

function tryUnlock(){
  const val = document.getElementById("gateInput").value;
  if(val === PASSWORD){
    document.getElementById("gate").style.display     = "none";
    document.getElementById("formCard").style.display = "block";
  } else {
    const err = document.getElementById("gateErr");
    err.textContent = "Incorrect password. Try again.";
    document.getElementById("gateInput").value = "";
    document.getElementById("gateInput").focus();
    setTimeout(() => err.textContent = "", 2500);
  }
}

document.getElementById("gateBtn").onclick = tryUnlock;
document.getElementById("gateInput").addEventListener("keydown", e => {
  if(e.key === "Enter") tryUnlock();
});
// ──────────────────────────────────────────────────────────────

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxXcrSvLxCGpM5zgTYE6jyf6DSGJ3VP-F1eo8se235t39liUXyB6q--zNZE2T8UpNl4DA/exec";

// ── MVP Scoring Parameters (harus sama dengan di index.html) ──────
const MVP_CONFIG = {
  rating: [
    { min: 3.0,  max: 9.5,  pts: 1 },
    { min: 9.6,  max: 10.5, pts: 2 },
    { min: 10.6, max: 15.0, pts: 3 }
  ],
  result: { win: 2, lose: 1 },
  stage:  { upper: 2, lower: 1, grand_final: 3 }
};

function calcMVPPts(rating, isWin, stage) {
  const r = parseFloat(rating);
  const rPts   = isNaN(r) ? 0 : (MVP_CONFIG.rating.find(t => r >= t.min && r <= t.max)?.pts ?? 0);
  const rRes   = isWin ? MVP_CONFIG.result.win : MVP_CONFIG.result.lose;
  const rStage = MVP_CONFIG.stage[stage] ?? MVP_CONFIG.stage.lower;
  return rPts + rRes + rStage;
}

function getRatingPts(rating) {
  const r = parseFloat(rating);
  if (isNaN(r)) return null;
  return MVP_CONFIG.rating.find(t => r >= t.min && r <= t.max)?.pts ?? null;
}
// ─────────────────────────────────────────────────────────────────

let data = {};
let matches = [];

const GROUP_MAP = {
  A:["LUCTARI","Panthera","Happy family","HUMBLE TEAM","Warteg Berkah Jaya","Crown X Sulawesi E-sport","BTRB","166 JKT","Dark Horse"],
  B:["Taoism","TBRN FURY","RX Squad","Royal One","ASPAL Reignite","170 PARES","Sikat Miring e-Sport","Aura Farming.PKU108","Gatsu E-sports"],
  C:["UNSTOPPABLE","Jujutsu IT","Kuningan x Priuk","MEGAKING : TUA","HELL GLORIOUS","MACHITIS","Gasspadia Squad","TBRN THUNDER","Royal One Klp"],
  D:["MEGAKING : ENDGAME","BGST","EJS REBORN","Thunder Redeb","Komodo Komando","TBRN RAVAGER","BANGJOS e Sport","Blackout Renegades","MBG Squad Region XII Papua","Wumbo Wumbo"]
};

const debugBox = document.getElementById("debug");

const TODAY = new Date().toISOString().split('T')[0];
tanggal.value = TODAY;
document.getElementById('po-tanggal').value = TODAY;

// ── Group Stage: stage dropdown only (no GF in group stage) ──
const stageEl = document.getElementById("stage");
stageEl.onchange = updatePtsPreview;

function getStage() { return stageEl.value; }

fetch("mmpl.json")
  .then(r => r.json())
  .then(res => { data = res; initGroup(); });

function initGroup(){
  Object.keys(GROUP_MAP).forEach(g => {
    group.add(new Option("Group " + g, g));
  });
  group.onchange = onGroupChange;
}

function genMatch(teams){
  let m = [];
  for(let i = 0; i < teams.length; i++)
    for(let j = i + 1; j < teams.length; j++)
      m.push({ t1: teams[i], t2: teams[j] });
  return m;
}

function onGroupChange(){
  reset(["match","winner","mvpWinner","mvpLoser"]);
  resetRating();
  if(!group.value) return;

  matches = genMatch(GROUP_MAP[group.value]);
  match.disabled = false;
  matches.forEach((m, i) => match.add(new Option(m.t1 + " vs " + m.t2, i)));
  match.onchange = onMatchChange;
}

function onMatchChange(){
  reset(["winner","mvpWinner","mvpLoser"]);
  resetRating();
  if(match.value === "") return;

  let m = matches[match.value];
  winner.disabled = false;
  winner.add(new Option(m.t1, m.t1));
  winner.add(new Option(m.t2, m.t2));
  winner.onchange = onWinnerChange;
}

function onWinnerChange(){
  reset(["mvpWinner","mvpLoser"]);
  resetRating();
  if(!winner.value) return;

  let m = matches[match.value];
  let loser = (winner.value === m.t1) ? m.t2 : m.t1;

  fillPlayers("mvpWinner", winner.value);
  fillPlayers("mvpLoser", loser);
  validate();
}

function fillPlayers(id, team){
  let el = document.getElementById(id);
  el.innerHTML = "";
  el.disabled = false;

  let none = document.createElement("option");
  none.value = "none";
  none.text  = "— None —";
  el.appendChild(none);

  let t = data.teams.find(x => x.team_name === team);
  t.members.forEach(p => {
    let opt = document.createElement("option");
    opt.value = p.game_id;
    opt.text = p.game_nick;
    el.appendChild(opt);
  });

  el.onchange = () => {
    const isNone = el.value === "none";
    const ratingEl = document.getElementById(id === "mvpWinner" ? "ratingWinner" : "ratingLoser");
    ratingEl.disabled = isNone;
    if (isNone) ratingEl.value = "";
    updatePtsPreview();
    validate();
  };

  // enable rating input
  const ratingId = id === "mvpWinner" ? "ratingWinner" : "ratingLoser";
  const ratingEl = document.getElementById(ratingId);
  ratingEl.disabled = false;
  ratingEl.oninput = () => { updatePtsPreview(); validate(); };
}

function updatePtsPreview() {
  const stage = getStage();
  const stagePts = MVP_CONFIG.stage[stage] ?? MVP_CONFIG.stage.lower;
  const stageLabel = stage === "grand_final" ? "GF" : stage === "upper" ? "UB" : "LB";

  ["Winner","Loser"].forEach(side => {
    const isWin = side === "Winner";
    const ratingEl = document.getElementById("rating" + side);
    const previewEl = document.getElementById("pts" + side);
    const playerEl = document.getElementById("mvp" + side);

    if (!playerEl || playerEl.value === "" || playerEl.value === "none") {
      previewEl.className = "pts-preview";
      previewEl.innerHTML = "— pilih player & masukkan rating";
      return;
    }

    const rv = ratingEl.value;
    const rPts = getRatingPts(rv);
    const resPts = isWin ? MVP_CONFIG.result.win : MVP_CONFIG.result.lose;
    const resLabel = isWin ? "Win" : "Lose";

    if (rv === "" || rPts === null) {
      previewEl.className = "pts-preview";
      previewEl.innerHTML = `Masukkan rating valid (8.0 – 15.0)`;
      return;
    }

    const total = rPts + resPts + stagePts;
    previewEl.className = "pts-preview ready";
    previewEl.innerHTML =
      `<span class="pts-badge">${total} pts</span>` +
      `<span class="pts-formula">${rPts}(rating) + ${resPts}(${resLabel}) + ${stagePts}(${stageLabel})</span>`;
  });
}

function resetRating() {
  ["ratingWinner","ratingLoser"].forEach(id => {
    const el = document.getElementById(id);
    el.value = "";
    el.disabled = true;
  });
  document.getElementById("ptsWinner").className = "pts-preview";
  document.getElementById("ptsWinner").innerHTML = "— pilih player & masukkan rating";
  document.getElementById("ptsLoser").className = "pts-preview";
  document.getElementById("ptsLoser").innerHTML = "— pilih player & masukkan rating";
}

function reset(ids){
  ids.forEach(id => {
    let el = document.getElementById(id);
    el.innerHTML = '<option value="">Select</option>';
    el.disabled = true;
  });
}

function isRatingValid(playerEl, ratingEl) {
  if (playerEl.value === "" || playerEl.value === "none") return true;
  const r = parseFloat(ratingEl.value);
  return !isNaN(r) && r >= 3.0 && r <= 15.0;
}

function validate(){
  const winnerOk = mvpWinner.value !== "";
  const loserOk  = mvpLoser.value  !== "";
  const ratingWOk = isRatingValid(mvpWinner, document.getElementById("ratingWinner"));
  const ratingLOk = isRatingValid(mvpLoser,  document.getElementById("ratingLoser"));
  submitBtn.disabled = !(
    group.value && match.value !== "" &&
    winner.value && winnerOk && loserOk && ratingWOk && ratingLOk
  );
}

function resetForm(){
  group.value = "";
  match.innerHTML  = '<option value="">Select Match</option>';
  winner.innerHTML = '<option value="">Select Winner</option>';
  mvpWinner.innerHTML = '<option value="">—</option>';
  mvpLoser.innerHTML  = '<option value="">—</option>';
  [match, winner, mvpWinner, mvpLoser].forEach(el => el.disabled = true);
  stageEl.value = "lower";
  note.value = "";
  resetRating();
  submitBtn.disabled = true;
}

// ── TAB SWITCHER ─────────────────────────────────────
let playoffInited = false;

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === tab)
  );
  document.querySelectorAll('.tab-panel').forEach(p =>
    p.classList.toggle('active', p.id === 'tab-' + tab)
  );
  if (tab === 'playoff' && !playoffInited) {
    playoffInited = true;
    initPlayoffTab();
  }
}
// ─────────────────────────────────────────────────────

// ── PLAYOFF TAB ───────────────────────────────────────
let poMatches = []; // final bracket matches (processed)
let poRoster  = {}; // team_name → members[] (from mmpl.json)

async function initPlayoffTab() {
  try {
    const [bracketResp, mmplResp] = await Promise.all([
      fetch(`final_bracket.json?v=${Date.now()}`, { cache: 'no-store' }),
      fetch(`mmpl.json?v=${Date.now()}`,           { cache: 'no-store' })
    ]);

    if (!bracketResp.ok) throw new Error(`final_bracket.json: HTTP ${bracketResp.status}. Jalankan sync terlebih dahulu.`);

    const bracket  = await bracketResp.json();
    const mmplData = await mmplResp.json();

    // Roster lookup
    (mmplData.teams || []).forEach(t => { poRoster[t.team_name] = t.members; });

    // Participant map
    const pMap = {};
    (bracket.tournament.participants || []).forEach(({ participant: p }) => {
      pMap[p.id] = p.display_name || p.name;
    });

    // Match lookup
    const mById = {};
    (bracket.tournament.matches || []).forEach(m => { mById[m.match.id] = m.match; });

    // Final stage = group_id === null
    const allM  = (bracket.tournament.matches || []).map(m => m.match);
    const final = allM.filter(m => m.group_id === null);

    if (!final.length) throw new Error('Final stage belum dimulai di Challonge. Coba lagi setelah group stage selesai.');

    const maxU = Math.max(...final.filter(m => m.round > 0).map(m => m.round));

    // Build processed match list (skip fully-pending = both players unknown, but always include GF)
    poMatches = final
      .filter(m => (m.player1_id || m.player2_id) || m.round === maxU)
      .sort((a, b) => (a.suggested_play_order || 0) - (b.suggested_play_order || 0))
      .map(m => ({
        ...m,
        p1: pMap[m.player1_id] || null,
        p2: pMap[m.player2_id] || null,
        bracketType: m.round < 0 ? 'lower' : (m.round === maxU ? 'grand_final' : 'upper'),
      }));

    if (!poMatches.length) throw new Error('Belum ada match final yang bisa dipilih.');

    const sel = document.getElementById('po-match');
    poMatches.forEach((m, i) => {
      const order = m.suggested_play_order || (i + 1);
      const type  = m.bracketType === 'grand_final' ? 'Grand Final'
                  : m.bracketType === 'upper'       ? `Upper R${m.round}`
                  : `Losers R${Math.abs(m.round)}`;
      const t1 = m.p1 || 'TBD', t2 = m.p2 || 'TBD';
      const status = m.state === 'complete' ? ' ✓' : m.state === 'underway' ? ' ●' : '';
      sel.add(new Option(`M${order} · ${type} — ${t1} vs ${t2}${status}`, i));
    });

    sel.disabled = false;
    sel.onchange = onPoMatchChange;

    document.getElementById('po-loading').style.display = 'none';
    document.getElementById('po-form').style.display = '';

  } catch (err) {
    document.getElementById('po-loading').style.display = 'none';
    const errEl = document.getElementById('po-error');
    errEl.textContent = err.message;
    errEl.style.display = '';
  }
}

function getPoStage(m) {
  const gfEl = document.getElementById('po-grandFinal');
  return (gfEl && gfEl.checked) ? 'grand_final' : m.bracketType;
}

function onPoMatchChange() {
  const idx = document.getElementById('po-match').value;
  resetPoDetails();
  if (idx === '') return;

  const m = poMatches[parseInt(idx)];

  // Stage badge
  const badgeMap = {
    upper:       'Upper Bracket (+2 pts)',
    lower:       'Lower Bracket (+1 pt)',
    grand_final: 'Grand Final (+3 pts)',
  };
  const badge = document.getElementById('po-stage-badge');
  badge.textContent = badgeMap[m.bracketType] || m.bracketType;
  badge.className   = 'stage-badge ' + m.bracketType;
  document.getElementById('po-stage-info').style.display = '';

  // GF checkbox — show only when match is NOT already auto-detected as GF
  const gfField  = document.getElementById('po-gf-field');
  const gfCb = document.getElementById('po-grandFinal');
  gfField.style.display = '';
  gfCb.checked = (m.bracketType === 'grand_final');
  gfCb.onchange = function() {
    // Update badge
    const stage = getPoStage(m);
    badge.textContent = badgeMap[stage] || stage;
    badge.className   = 'stage-badge ' + stage;
    updatePoPreview(m);
    validatePo();
  };

  // Winner
  const poWinner = document.getElementById('po-winner');
  if (m.state === 'complete' && m.winner_id) {
    const winName = m.winner_id === m.player1_id ? m.p1 : m.p2;
    poWinner.add(new Option(winName + ' (Challonge)', winName));
    poWinner.value    = winName;
    poWinner.disabled = true;
    fillPoSides(m, winName);
  } else {
    if (m.p1) poWinner.add(new Option(m.p1, m.p1));
    if (m.p2) poWinner.add(new Option(m.p2, m.p2));
    poWinner.disabled = false;
    poWinner.onchange = () => { if (poWinner.value) fillPoSides(m, poWinner.value); };
  }
  validatePo();
}

function fillPoSides(m, winnerName) {
  const loserName = winnerName === m.p1 ? m.p2 : m.p1;
  fillPoPlayers('po-mvpWinner', winnerName, 'po-ratingWinner', 'po-ptsWinner', true,  m);
  fillPoPlayers('po-mvpLoser',  loserName,  'po-ratingLoser',  'po-ptsLoser',  false, m);
}

function fillPoPlayers(selId, teamName, ratingId, previewId, isWin, m) {
  const bracketType = m.bracketType; // kept for reference, actual stage from getPoStage(m)
  const sel    = document.getElementById(selId);
  const rating = document.getElementById(ratingId);
  sel.innerHTML = '';
  sel.disabled  = false;
  sel.appendChild(new Option('— None —', 'none'));

  const roster = poRoster[teamName] || [];
  roster.forEach(p => sel.appendChild(new Option(p.game_nick, p.game_id)));

  const refresh = () => {
    const isNone = sel.value === 'none';
    rating.disabled = isNone;
    if (isNone) rating.value = '';
    updatePoPreview(m);
    validatePo();
  };

  sel.onchange   = refresh;
  rating.oninput = () => { updatePoPreview(m); validatePo(); };
  refresh(); // apply initial state: disable rating until a player is chosen
}

function updatePoPreview(m) {
  const bracketType = getPoStage(m);
  const stagePts  = MVP_CONFIG.stage[bracketType] ?? MVP_CONFIG.stage.lower;
  const stageLabel = bracketType === 'grand_final' ? 'GF' : bracketType === 'upper' ? 'UB' : 'LB';

  [['po-mvpWinner','po-ratingWinner','po-ptsWinner',true],
   ['po-mvpLoser', 'po-ratingLoser', 'po-ptsLoser', false]].forEach(([sId, rId, pId, isWin]) => {
    const sel     = document.getElementById(sId);
    const ratingEl = document.getElementById(rId);
    const preview  = document.getElementById(pId);

    if (!sel || sel.value === '' || sel.value === 'none') {
      preview.className = 'pts-preview';
      preview.innerHTML = '— pilih player & masukkan rating';
      return;
    }
    const rPts     = getRatingPts(ratingEl.value);
    const resPts   = isWin ? MVP_CONFIG.result.win : MVP_CONFIG.result.lose;
    const resLabel = isWin ? 'Win' : 'Lose';
    if (!ratingEl.value || rPts === null) {
      preview.className = 'pts-preview';
      preview.innerHTML = 'Masukkan rating valid (8.0 – 15.0)';
      return;
    }
    const total = rPts + resPts + stagePts;
    preview.className = 'pts-preview ready';
    preview.innerHTML = `<span class="pts-badge">${total} pts</span><span class="pts-formula">${rPts}(rating) + ${resPts}(${resLabel}) + ${stagePts}(${stageLabel})</span>`;
  });
}

function validatePo() {
  const ok =
    document.getElementById('po-match').value !== '' &&
    document.getElementById('po-winner').value !== '' &&
    document.getElementById('po-mvpWinner').value !== '' &&
    document.getElementById('po-mvpLoser').value  !== '' &&
    isRatingValid(document.getElementById('po-mvpWinner'), document.getElementById('po-ratingWinner')) &&
    isRatingValid(document.getElementById('po-mvpLoser'),  document.getElementById('po-ratingLoser'));
  document.getElementById('po-submitBtn').disabled = !ok;
}

function resetPoDetails() {
  ['po-winner','po-mvpWinner','po-mvpLoser'].forEach(id => {
    const el = document.getElementById(id);
    el.innerHTML = '<option value="">Select</option>';
    el.disabled  = true;
  });
  ['po-ratingWinner','po-ratingLoser'].forEach(id => {
    document.getElementById(id).value = '';
    document.getElementById(id).disabled = true;
  });
  ['po-ptsWinner','po-ptsLoser'].forEach(id => {
    document.getElementById(id).className = 'pts-preview';
    document.getElementById(id).innerHTML = '— pilih player & masukkan rating';
  });
  document.getElementById('po-stage-info').style.display = 'none';
  document.getElementById('po-gf-field').style.display   = 'none';
  const gfCb = document.getElementById('po-grandFinal');
  if (gfCb) { gfCb.checked = false; }
  document.getElementById('po-submitBtn').disabled = true;
}

document.getElementById('po-submitBtn').onclick = async function() {
  const dbg = document.getElementById('po-debug');
  dbg.className  = 'loading';
  dbg.innerText  = 'Saving...';

  const idx = parseInt(document.getElementById('po-match').value);
  const m   = poMatches[idx];
  const win = document.getElementById('po-winner').value;
  const order = m.suggested_play_order || (idx + 1);

  const g = (id) => document.getElementById(id);
  const val = (id) => g(id).value;

  const stageKey  = getPoStage(m);
  const stagePts  = MVP_CONFIG.stage[stageKey] ?? MVP_CONFIG.stage.lower;
  const winIsNone = val('po-mvpWinner') === 'none';
  const losIsNone = val('po-mvpLoser')  === 'none';

  // Calculate total points for note field (format: "winner;loser")
  const winnerTotal = winIsNone ? '' : (getRatingPts(val('po-ratingWinner')) ?? 0) + MVP_CONFIG.result.win + stagePts;
  const loserTotal = losIsNone ? '' : (getRatingPts(val('po-ratingLoser')) ?? 0) + MVP_CONFIG.result.lose + stagePts;
  const pointsNote = winnerTotal && loserTotal ? `${winnerTotal};${loserTotal}` : '';

  const payload = {
    source:            'playoff',
    tanggal:           val('po-tanggal'),
    group:             'Playoff',
    match:             `M${order}: ${m.p1 || 'TBD'} vs ${m.p2 || 'TBD'}`,
    winner:            win,
    stage:             stageKey,
    mvp_winner_id:     winIsNone ? '' : val('po-mvpWinner'),
    mvp_winner_name:   winIsNone ? '' : g('po-mvpWinner').options[g('po-mvpWinner').selectedIndex].text,
    mvp_winner_rating: winIsNone ? '' : val('po-ratingWinner'),
    mvp_winner_points: winIsNone ? '' : `${getRatingPts(val('po-ratingWinner')) ?? 0};${MVP_CONFIG.result.win};${stagePts}`,
    mvp_loser_id:      losIsNone ? '' : val('po-mvpLoser'),
    mvp_loser_name:    losIsNone ? '' : g('po-mvpLoser').options[g('po-mvpLoser').selectedIndex].text,
    mvp_loser_rating:  losIsNone ? '' : val('po-ratingLoser'),
    mvp_loser_points:  losIsNone ? '' : `${getRatingPts(val('po-ratingLoser')) ?? 0};${MVP_CONFIG.result.lose};${stagePts}`,
    note:              pointsNote,
    note:              val('po-note'),
  };

  g('po-submitBtn').disabled = true;
  try {
    await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
    dbg.className = 'ok';
    dbg.innerText = 'Saved successfully';
    g('po-match').value = '';
    resetPoDetails();
  } catch(e) {
    dbg.className = 'err';
    dbg.innerText = 'Failed to save, please try again';
    g('po-submitBtn').disabled = false;
  }
};
// ─────────────────────────────────────────────────────

submitBtn.onclick = async function(){
  debugBox.className = "loading";
  debugBox.innerText = "Saving...";

  let m = matches[match.value];
  const stage = getStage();

  let payload = {
    tanggal: tanggal.value,
    group: group.value,
    match: m.t1 + " vs " + m.t2,
    winner: winner.value,
    stage: stage,
    mvp_winner_id:     mvpWinner.value === "none" ? "" : mvpWinner.value,
    mvp_winner_name:   mvpWinner.value === "none" ? "" : mvpWinner.options[mvpWinner.selectedIndex].text,
    mvp_winner_rating: mvpWinner.value === "none" ? "" : document.getElementById("ratingWinner").value,
    mvp_loser_id:      mvpLoser.value  === "none" ? "" : mvpLoser.value,
    mvp_loser_name:    mvpLoser.value  === "none" ? "" : mvpLoser.options[mvpLoser.selectedIndex].text,
    mvp_loser_rating:  mvpLoser.value  === "none" ? "" : document.getElementById("ratingLoser").value,
    note: note.value
  };

  submitBtn.disabled = true;

  try {
    await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) });
    debugBox.className = "ok";
    debugBox.innerText = "Saved successfully";
    resetForm();
  } catch(e) {
    debugBox.className = "err";
    debugBox.innerText = "Failed to save, please try again";
    submitBtn.disabled = false;
  }
};
