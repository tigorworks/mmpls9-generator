<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMPL S9 - MVP LEADERBOARD</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gold:   #f59e0b;
  --silver: #cbd5e1;
  --bronze: #cd7f32;
  --blue:   #60a5fa;
  --dim:    #4b5563;
  --bright: #f1f5f9;
}

body {
  font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
  background: #07090f url('bg.png') center center / 63% auto no-repeat fixed;
  color: var(--bright);
  min-height: 100vh;
  padding: 48px 16px 72px;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: rgba(5,7,14,.78);
  pointer-events: none;
  z-index: 0;
}

.container {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 960px;
  margin: 0 auto;
  padding: 0 20px;
}

/* ── hero ── */
.hero {
  text-align: center;
  margin-bottom: 36px;
}

.hero-eyebrow {
  display: inline-block;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--gold);
  border: 1px solid rgba(245,158,11,.3);
  background: rgba(245,158,11,.06);
  padding: 7px 20px;
  border-radius: 100px;
  margin-bottom: 14px;
}

.hero h1 {
  font-size: clamp(28px, 5vw, 44px);
  font-weight: 900;
  letter-spacing: -1px;
  line-height: 1.05;
  background: linear-gradient(135deg, #fde68a 0%, #f59e0b 50%, #d97706 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.hero-sub {
  margin-top: 8px;
  font-size: 13px;
  color: #4b5563;
  letter-spacing: .3px;
}

.hero-datetime {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  margin-top: 12px;
  padding: 5px 14px;
  border-radius: 100px;
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(255,255,255,.07);
  font-size: 12px;
  font-weight: 500;
  color: #4b5563;
  letter-spacing: .4px;
  font-variant-numeric: tabular-nums;
}

.hero-datetime .dt-sep {
  color: rgba(255,255,255,.12);
}

/* ── tabs ── */
.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 16px;
  background: rgba(10,14,26,.6);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 12px;
  padding: 5px;
}

.tab {
  flex: 1;
  padding: 9px 10px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: transparent;
  color: #4b5563;
  font-size: 13px;
  font-weight: 600;
  font-family: inherit;
  letter-spacing: .3px;
  cursor: pointer;
  transition: background .15s, color .15s, border-color .15s;
  white-space: nowrap;
}

.tab:hover:not(.active) {
  background: rgba(255,255,255,.05);
  color: #94a3b8;
}

.tab.active {
  background: rgba(245,158,11,.12);
  color: var(--gold);
  border-color: rgba(245,158,11,.22);
}

/* ── glass panel ── */
.panel {
  background: rgba(10,14,26,.55);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 18px;
  overflow: hidden;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.03),
    0 32px 64px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(255,255,255,.05);
}

.table-scroll {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

/* ── table ── */
table { width: 100%; border-collapse: collapse; }

thead tr {
  background: rgba(255,255,255,.04);
  border-bottom: 1px solid rgba(255,255,255,.07);
}

thead th {
  padding: 14px 18px;
  text-align: left;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #4b5563;
  white-space: nowrap;
}

thead th:first-child { text-align: center; width: 56px; }
thead th:last-child  { text-align: center; }

tbody tr {
  border-bottom: 1px solid rgba(255,255,255,.05);
  transition: background .15s;
}

tbody tr:last-child { border-bottom: none; }

tbody tr:not(.rank-1):not(.rank-2):not(.rank-3):not(.divider-row):hover {
  background: rgba(255,255,255,.03);
}

tbody td {
  padding: 13px 18px;
  font-size: 14px;
  vertical-align: middle;
  color: var(--dim);
}

tbody td:first-child {
  text-align: center;
  font-size: 13px;
  font-weight: 600;
  color: var(--dim);
  width: 56px;
}

.badge-group {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 7px;
  font-size: 12px;
  font-weight: 800;
  background: rgba(96,165,250,.1);
  color: #60a5fa;
  border: 1px solid rgba(96,165,250,.18);
}

.team-name {
  font-size: 12px;
  font-weight: 500;
  color: var(--dim);
}

.player-cell {
  display: flex;
  align-items: center;
  gap: 10px;
}

.player-avatar {
  width: 30px;
  height: 30px;
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  flex-shrink: 0;
  text-transform: uppercase;
}

.player-name {
  font-weight: 600;
  font-size: 14px;
  color: var(--dim);
}

.pts {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 34px;
  padding: 3px 10px;
  border-radius: 7px;
  font-size: 13px;
  font-weight: 800;
  background: rgba(255,255,255,.05);
  color: #4b5563;
  border: 1px solid rgba(255,255,255,.08);
}

/* ── top 3 ── */
tbody tr.rank-1 {
  background: linear-gradient(90deg, rgba(245,158,11,.18) 0%, rgba(245,158,11,.05) 55%, transparent 100%);
  box-shadow: inset 4px 0 0 var(--gold);
}
tbody tr.rank-2 {
  background: linear-gradient(90deg, rgba(203,213,225,.14) 0%, rgba(203,213,225,.04) 55%, transparent 100%);
  box-shadow: inset 4px 0 0 var(--silver);
}
tbody tr.rank-3 {
  background: linear-gradient(90deg, rgba(205,127,50,.15) 0%, rgba(205,127,50,.04) 55%, transparent 100%);
  box-shadow: inset 4px 0 0 var(--bronze);
}

tbody tr.rank-1:hover { background: linear-gradient(90deg, rgba(245,158,11,.26) 0%, rgba(245,158,11,.08) 55%, transparent 100%); }
tbody tr.rank-2:hover { background: linear-gradient(90deg, rgba(203,213,225,.20) 0%, rgba(203,213,225,.06) 55%, transparent 100%); }
tbody tr.rank-3:hover { background: linear-gradient(90deg, rgba(205,127,50,.22) 0%, rgba(205,127,50,.06) 55%, transparent 100%); }

tbody tr.rank-1 td,
tbody tr.rank-2 td,
tbody tr.rank-3 td { font-size: 15px; color: var(--bright); }

tbody tr.rank-1 td:first-child,
tbody tr.rank-2 td:first-child,
tbody tr.rank-3 td:first-child { font-size: 16px; color: var(--bright); }

tbody tr.rank-1 .player-name,
tbody tr.rank-2 .player-name,
tbody tr.rank-3 .player-name { font-size: 16px; font-weight: 700; color: var(--bright); }

tbody tr.rank-1 .team-name,
tbody tr.rank-2 .team-name,
tbody tr.rank-3 .team-name { font-size: 13px; color: rgba(241,245,249,.65); }


.rank-medal { font-size: 20px; line-height: 1; }

tbody tr.rank-1 .pts { background: rgba(245,158,11,.2);  border-color: rgba(245,158,11,.45); color: #fde68a; font-size: 14px; }
tbody tr.rank-2 .pts { background: rgba(203,213,225,.14); border-color: rgba(203,213,225,.35); color: #e2e8f0; font-size: 14px; }
tbody tr.rank-3 .pts { background: rgba(205,127,50,.18); border-color: rgba(205,127,50,.4);  color: #fcd9a0; font-size: 14px; }

/* ── divider top 10 ── */
.divider-row td {
  padding: 0 !important;
  height: 0;
  border-bottom: 1px dashed rgba(245,158,11,.2) !important;
}

/* ── state rows ── */
.state-row td {
  padding: 64px 20px;
  text-align: center;
  color: #4b5563;
}

.state-icon {
  font-size: 30px;
  display: block;
  margin-bottom: 10px;
  opacity: .35;
}

.state-label { font-size: 14px; }

.loading-wrap {
  display: inline-flex;
  align-items: center;
  gap: 20px;
  padding: 20px 28px;
  background: rgba(255,255,255,.03);
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 14px;
}

.loading-steps {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: flex-start;
}

.loading-step {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 12px;
  color: #374151;
  transition: color .2s;
  white-space: nowrap;
}

.loading-step.active { color: #94a3b8; }
.loading-step.done   { color: #34d399; }

.step-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #1f2937;
  flex-shrink: 0;
  transition: background .2s;
}

.loading-step.active .step-dot {
  background: var(--gold);
  box-shadow: 0 0 6px rgba(245,158,11,.5);
  animation: pulse-dot .8s ease infinite;
}

.loading-step.done .step-dot { background: #34d399; }

@keyframes pulse-dot {
  0%,100% { opacity: 1; transform: scale(1); }
  50%      { opacity: .6; transform: scale(.75); }
}

.spinner {
  width: 30px;
  height: 30px;
  border: 2.5px solid rgba(255,255,255,.08);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  flex-shrink: 0;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ── footer ── */
.footer-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 18px;
  background: rgba(255,255,255,.03);
  border-top: 1px solid rgba(255,255,255,.06);
  gap: 12px;
}

.last-update {
  font-size: 11px;
  color: #374151;
  letter-spacing: .3px;
}

.source-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 600;
  color: #374151;
  text-decoration: none;
  letter-spacing: .3px;
  transition: color .15s;
  white-space: nowrap;
}

.source-link:hover {
  color: var(--gold);
}

.print-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 12px;
  border-radius: 7px;
  border: 1px solid rgba(255,255,255,.1);
  background: rgba(255,255,255,.04);
  color: #4b5563;
  font-size: 11px;
  font-weight: 600;
  font-family: inherit;
  letter-spacing: .3px;
  cursor: pointer;
  transition: background .15s, color .15s, border-color .15s;
  white-space: nowrap;
}

.print-btn:hover {
  background: rgba(255,255,255,.08);
  color: var(--bright);
  border-color: rgba(255,255,255,.18);
}

.footer-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.refresh-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,.1);
  background: rgba(255,255,255,.04);
  color: #4b5563;
  font-size: 11px;
  font-weight: 600;
  font-family: inherit;
  letter-spacing: .3px;
  cursor: pointer;
  transition: background .15s, color .15s, border-color .15s;
  white-space: nowrap;
}

.refresh-btn:hover {
  background: rgba(255,255,255,.08);
  color: var(--bright);
  border-color: rgba(255,255,255,.18);
}

.refresh-btn svg { flex-shrink: 0; }

/* ── page footer ── */
.page-footer {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin: 24px auto 0;
  display: flex;
  justify-content: center;
}

.page-footer-inner {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 16px;
  border-radius: 100px;
  background: rgba(10,14,26,.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,.07);
  font-size: 11px;
  color: #4b5563;
  letter-spacing: .4px;
}

.page-footer-inner span {
  color: var(--gold);
  font-weight: 700;
}

/* ── mobile (≤ 480px — iPhone 17 Pro Max dan ke bawah) ── */
@media (max-width: 480px) {

  body {
    padding: 28px 0 56px;
    background-size: 120% auto;
  }

  .container {
    padding: 0 12px;
  }

  /* hero */
  .hero {
    margin-bottom: 24px;
  }

  .hero-eyebrow {
    font-size: 11px;
    letter-spacing: 2px;
    padding: 5px 14px;
  }

  .hero h1 {
    font-size: clamp(22px, 7vw, 32px);
    letter-spacing: -.5px;
  }

  /* tabs — scrollable row, tidak di-wrap */
  .tabs {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    flex-wrap: nowrap;
    padding: 4px;
    gap: 3px;
    border-radius: 10px;
    scrollbar-width: none;
  }

  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex: 0 0 auto;
    padding: 8px 14px;
    font-size: 12px;
    border-radius: 7px;
  }

  /* panel */
  .panel {
    border-radius: 14px;
  }

  /* table header */
  thead th {
    padding: 11px 10px;
    font-size: 9px;
    letter-spacing: 1px;
  }

  thead th:first-child { width: 40px; }

  /* table body */
  tbody td {
    padding: 11px 10px;
    font-size: 13px;
  }

  tbody td:first-child {
    width: 40px;
    font-size: 12px;
  }

  /* player */
  .player-cell { gap: 8px; }

  .player-avatar {
    width: 26px;
    height: 26px;
    font-size: 11px;
    border-radius: 6px;
    flex-shrink: 0;
  }

  .player-name {
    font-size: 13px;
  }

  /* team */
  .team-name {
    font-size: 11px;
  }

  /* group badge */
  .badge-group {
    width: 24px;
    height: 24px;
    font-size: 11px;
    border-radius: 6px;
  }

  /* points */
  .pts {
    font-size: 12px;
    padding: 3px 8px;
    min-width: 28px;
  }

  /* rank top 3 */
  tbody tr.rank-1 td,
  tbody tr.rank-2 td,
  tbody tr.rank-3 td { font-size: 14px; }

  tbody tr.rank-1 .player-name,
  tbody tr.rank-2 .player-name,
  tbody tr.rank-3 .player-name { font-size: 14px; }

  tbody tr.rank-1 td:first-child,
  tbody tr.rank-2 td:first-child,
  tbody tr.rank-3 td:first-child { font-size: 14px; }

  .rank-medal { font-size: 17px; }

  /* footer bar */
  .footer-bar { padding: 10px 12px; }

  /* page footer */
  .page-footer { margin-top: 18px; }

}

/* ── capture mode (html2canvas overrides) ── */
body.is-capturing {
  background-image: none !important;
}

body.is-capturing::before {
  display: none !important;
}

body.is-capturing .container {
  background: #07090f;
  padding: 32px 24px 40px;
}

/* solid gold instead of gradient clip (unsupported by html2canvas) */
body.is-capturing .hero h1 {
  background: none !important;
  -webkit-background-clip: unset !important;
  background-clip: unset !important;
  -webkit-text-fill-color: #f59e0b !important;
  color: #f59e0b !important;
}

/* remove all blur / glass — replace with solid dark bg */
body.is-capturing .tabs {
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  background: #0d1525 !important;
  border-color: rgba(255,255,255,.1) !important;
}

body.is-capturing .panel {
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  background: #0d1525 !important;
}

body.is-capturing .hero-datetime {
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  background: rgba(255,255,255,.05) !important;
}

body.is-capturing .page-footer-inner {
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  background: #0d1525 !important;
}

/* hide the download button itself from the capture */
body.is-capturing #captureBtn {
  display: none !important;
}

</style>
</head>

<body>
<div class="container">

  <div class="hero">
    <span class="hero-eyebrow">MMPL Season 9</span>
    <h1>MVP Leaderboard</h1>
    <div class="hero-datetime" id="liveClock">
      <span id="clockDate"></span>
      <span class="dt-sep">|</span>
      <span id="clockTime"></span>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="all">All</button>
    <button class="tab" data-tab="A">Group A</button>
    <button class="tab" data-tab="B">Group B</button>
    <button class="tab" data-tab="C">Group C</button>
    <button class="tab" data-tab="D">Group D</button>
  </div>

  <div class="panel">
    <div class="table-scroll">
      <table id="mainTable">
        <thead id="thead">
          <tr>
            <th>No</th>
            <th>Group</th>
            <th>Player</th>
            <th>Team</th>
            <th style="text-align:center">Points</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr class="state-row">
            <td colspan="5" id="loadingCell">
              <div class="loading-wrap">
                <div class="spinner"></div>
                <div class="loading-steps">
                  <span class="loading-step active" id="step-fetch">
                    <span class="step-dot"></span>Loading data..
                  </span>
                  <span class="loading-step" id="step-calc">
                    <span class="step-dot"></span>Tallying MVP points..
                  </span>
                  <span class="loading-step" id="step-render">
                    <span class="step-dot"></span>Rendering leaderboard..
                  </span>
                </div>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="footer-bar">
      <span class="last-update" id="lastUpdate"></span>
      <div class="footer-right">
        <button class="print-btn" id="captureBtn">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download
        </button>
        <a class="source-link" href="https://docs.google.com/spreadsheets/d/1wOcrpZGuv5PDs_H970w-MMKHW1MLk04Mbb2TWbaXXPA/edit?usp=sharing" target="_blank" rel="noopener noreferrer">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          Source Data
        </a>
      </div>
    </div>
  </div>

  <div class="page-footer">
    <div class="page-footer-inner">
      Powered by <span>Tigor M Manurung</span>
    </div>
  </div>

</div>

<script>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxXcrSvLxCGpM5zgTYE6jyf6DSGJ3VP-F1eo8se235t39liUXyB6q--zNZE2T8UpNl4DA/exec";
const MEDALS = ["🥇","🥈","🥉"];

let allRanked = [];
let activeTab = "all";

function loadData(){
  showLoading();

  let httpOk = false;

  fetch(SCRIPT_URL)
    .then(r => {
      if(!r.ok){
        throw { type: "server", status: r.status };
      }
      httpOk = true;
      return r.json();
    })
    .then(parsed => {
      setStep("step-fetch", "done");
      setStep("step-calc", "active");
      const rows = Array.isArray(parsed) ? parsed : (parsed.data || []);
      setTimeout(() => {
        processData(rows, parsed.lastUpdate || "");
      }, 80);
    })
    .catch(err => {
      if(err && err.type === "server"){
        showError("The server returned an error. Please try again later.");
      } else if(!httpOk){
        showError("Unable to connect. Check your internet connection and refresh.");
      } else {
        showError("Received an unexpected response. Please refresh.");
      }
    });
}

const VS_RE = /\s+vs\s+/i; // dikompilasi sekali, dipakai ulang tiap baris

function processData(rows, lastUpdate){
  const players = {};

  rows.forEach(r => {
    const group    = r["Group"]            || "-";
    const match    = r["Match"]            || "";
    const winner   = (r["Winner"]          || "-").trim(); // trim sekali
    const idW   = String(r["MVP Winner ID"]   ?? "").trim();
    const nickW = String(r["MVP Winner Nick"] ?? "").trim();
    const idL   = String(r["MVP Loser ID"]    ?? "").trim();
    const nickL = String(r["MVP Loser Nick"]  ?? "").trim();

    if(idW){
      if(!players[idW]) players[idW] = { nick: nickW, group, team: winner, pts: 0 };
      else if(nickW) players[idW].nick = nickW; // update nick if changed
      players[idW].pts += 2;
    }

    // skip if loser MVP is empty (match recorded as "None" or left blank)
    if(idL){
      const parts     = match.split(VS_RE);
      const loserTeam = parts.find(t => t.trim() !== winner) || "-";
      if(!players[idL]) players[idL] = { nick: nickL, group, team: loserTeam, pts: 0 };
      else if(nickL) players[idL].nick = nickL; // update nick if changed
      players[idL].pts += 1;
    }
  });

  allRanked = Object.values(players).sort((a, b) =>
    b.pts !== a.pts ? b.pts - a.pts : a.nick.localeCompare(b.nick)
  );

  setStep("step-calc", "done");
  setStep("step-render", "active");

  document.getElementById("lastUpdate").textContent =
    lastUpdate ? "Last updated: " + lastUpdate : "";

  setTimeout(() => {
    renderTab(activeTab);
  }, 60);
}

function renderTab(tab){
  activeTab = tab;
  const isAll = tab === "all";

  // update thead first — always, before any early return
  const cols = isAll
    ? `<th>No</th><th>Group</th><th>Player</th><th>Team</th><th style="text-align:center">Points</th>`
    : `<th>No</th><th>Player</th><th>Team</th><th style="text-align:center">Points</th>`;
  document.getElementById("thead").innerHTML = `<tr>${cols}</tr>`;

  const colspan = isAll ? 5 : 4;

  const list = isAll
    ? allRanked.slice(0, 15)
    : allRanked.filter(p => p.group === tab);

  if(!list.length){ showEmpty(colspan, tab); return; }
  const tbody = document.getElementById("tbody");
  let html = "";

  list.forEach((p, i) => {
    const rank   = i + 1;
    const isTop3 = rank <= 3;
    const medal  = MEDALS[i] || "";
    const cls    = isTop3 ? ` class="rank-${rank}"` : "";
    const noCell = medal ? `<span class="rank-medal">${medal}</span>` : rank;

    if(isAll && rank === 11){
      html += `<tr class="divider-row"><td colspan="${colspan}"></td></tr>`;
    }

    const groupCell = isAll ? `<td><span class="badge-group">${p.group}</span></td>` : "";

    // columns: No | [Group] | Player | Team | Points
    html += `<tr${cls}>
      <td>${noCell}</td>
      ${groupCell}
      <td>
        <div class="player-cell">
          <div class="player-avatar" ${avatarStyle(p.nick)}>${initials(p.nick)}</div>
          <span class="player-name">${p.nick}</span>
        </div>
      </td>
      <td><span class="team-name">${p.team}</span></td>
      <td style="text-align:center"><span class="pts">${p.pts}</span></td>
    </tr>`;
  });

  tbody.innerHTML = html;
  setStep("step-render", "done");
}

document.getElementById("tabs").addEventListener("click", e => {
  const btn = e.target.closest(".tab");
  if(!btn) return;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  btn.classList.add("active");
  allRanked.length ? renderTab(btn.dataset.tab) : (activeTab = btn.dataset.tab);
});

function initials(name){ return name ? name.trim().charAt(0).toUpperCase() : "?"; }

// dark-mode avatar palette — bg + text color pairs
const AVATAR_PALETTE = [
  { bg: "rgba(99,102,241,.25)",  border: "rgba(99,102,241,.4)",  color: "#a5b4fc" }, // indigo
  { bg: "rgba(20,184,166,.2)",   border: "rgba(20,184,166,.38)", color: "#5eead4" }, // teal
  { bg: "rgba(245,158,11,.18)",  border: "rgba(245,158,11,.35)", color: "#fcd34d" }, // amber
  { bg: "rgba(239,68,68,.2)",    border: "rgba(239,68,68,.35)",  color: "#fca5a5" }, // red
  { bg: "rgba(168,85,247,.22)",  border: "rgba(168,85,247,.38)", color: "#d8b4fe" }, // purple
  { bg: "rgba(59,130,246,.2)",   border: "rgba(59,130,246,.38)", color: "#93c5fd" }, // blue
  { bg: "rgba(16,185,129,.2)",   border: "rgba(16,185,129,.35)", color: "#6ee7b7" }, // emerald
  { bg: "rgba(236,72,153,.2)",   border: "rgba(236,72,153,.35)", color: "#f9a8d4" }, // pink
  { bg: "rgba(234,179,8,.2)",    border: "rgba(234,179,8,.35)",  color: "#fde047" }, // yellow
  { bg: "rgba(6,182,212,.2)",    border: "rgba(6,182,212,.35)",  color: "#67e8f9" }, // cyan
];

function avatarStyle(name){
  // hash name to a consistent index
  let hash = 0;
  for(let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
  const p = AVATAR_PALETTE[hash % AVATAR_PALETTE.length];
  return `style="background:${p.bg};border:1px solid ${p.border};color:${p.color}"`;
}

function showLoading(){
  document.getElementById("tbody").innerHTML = `
    <tr class="state-row"><td colspan="5">
      <div class="loading-wrap">
        <div class="spinner"></div>
        <div class="loading-steps">
          <span class="loading-step active" id="step-fetch">
            <span class="step-dot"></span>Loading data..
          </span>
          <span class="loading-step" id="step-calc">
            <span class="step-dot"></span>Tallying MVP points..
          </span>

}

function setStep(id, state){
  const el = document.getElementById(id);
  if(el) el.className = "loading-step " + state;
}

function showError(msg){
  const label = msg || "Failed to load data. Please refresh.";
  document.getElementById("tbody").innerHTML = `
    <tr class="state-row"><td colspan="5">
      <span class="state-icon">⚠</span>
      <span class="state-label">${label}</span>
    </td></tr>`;
}

function showEmpty(colspan = 5, tab){
  const isGroup = tab && tab !== "all";
  const icon  = isGroup ? "📭" : "🏆";
  const label = isGroup
    ? `No MVP data for Group ${tab} yet.`
    : "No MVP data recorded yet.";
  document.getElementById("tbody").innerHTML = `
    <tr class="state-row"><td colspan="${colspan}">
      <span class="state-icon">${icon}</span>
      <span class="state-label">${label}</span>
    </td></tr>`;
}

// ── live clock ──────────────────────────────────────────────────
const DAY_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function tickClock(){
  const now = new Date();
  const day   = DAY_NAMES[now.getDay()];
  const date  = now.getDate();
  const month = MONTH_NAMES[now.getMonth()];
  const year  = now.getFullYear();
  const hh    = String(now.getHours()).padStart(2,"0");
  const mm    = String(now.getMinutes()).padStart(2,"0");
  const ss    = String(now.getSeconds()).padStart(2,"0");
  document.getElementById("clockDate").textContent = `${day}, ${date} ${month} ${year}`;
  document.getElementById("clockTime").textContent = `${hh}:${mm}:${ss}`;
}
tickClock();

// ── export mode: build a purpose-built DOM node (100% inline styles) ──
function buildExportNode(){
  const isAll = activeTab === "all";
  const list  = isAll
    ? allRanked.slice(0, 15)
    : allRanked.filter(p => p.group === activeTab);

  const dateStr  = document.getElementById("clockDate").textContent;
  const timeStr  = document.getElementById("clockTime").textContent;
  const tabLabel = isAll ? "Overall — Top 15" : `Group ${activeTab} — Full Standings`;

  // style shortcuts
  const TD  = "padding:12px 18px;vertical-align:middle;border-bottom:1px solid rgba(255,255,255,.05);";
  const TH  = "padding:13px 18px;text-align:left;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#4b5563;white-space:nowrap;";

  // thead
  const theadHtml = isAll
    ? `<th style="${TH}text-align:center;width:52px;">No</th><th style="${TH}">Group</th><th style="${TH}">Player</th><th style="${TH}">Team</th><th style="${TH}text-align:center;">Points</th>`
    : `<th style="${TH}text-align:center;width:52px;">No</th><th style="${TH}">Player</th><th style="${TH}">Team</th><th style="${TH}text-align:center;">Points</th>`;

  // rows
  let rowsHtml = "";
  list.forEach((p, i) => {
    const rank   = i + 1;
    const isTop3 = rank <= 3;
    const medal  = ["🥇","🥈","🥉"][i] || "";

    const tdBg         = rank===1 ? "background:rgba(245,158,11,.12);"  : rank===2 ? "background:rgba(203,213,225,.08);" : rank===3 ? "background:rgba(205,127,50,.10);" : "";
    const firstBorder  = rank===1 ? "border-left:4px solid #f59e0b;"    : rank===2 ? "border-left:4px solid #cbd5e1;"    : rank===3 ? "border-left:4px solid #cd7f32;"    : "border-left:4px solid transparent;";
    const nameColor    = isTop3 ? "#f1f5f9"                  : "#94a3b8";
    const teamColor    = isTop3 ? "rgba(241,245,249,.65)"    : "#4b5563";
    const nameFS       = isTop3 ? "15px" : "13px";
    const nameFW       = isTop3 ? "700"  : "600";
    const noFS         = isTop3 ? "18px" : "13px";
    const ptsBg        = rank===1 ? "rgba(245,158,11,.2)"    : rank===2 ? "rgba(203,213,225,.14)" : rank===3 ? "rgba(205,127,50,.18)" : "rgba(255,255,255,.05)";
    const ptsBorder    = rank===1 ? "rgba(245,158,11,.45)"   : rank===2 ? "rgba(203,213,225,.35)" : rank===3 ? "rgba(205,127,50,.4)"  : "rgba(255,255,255,.08)";
    const ptsColor     = rank===1 ? "#fde68a"                : rank===2 ? "#e2e8f0"               : rank===3 ? "#fcd9a0"              : "#4b5563";
    const ptsFS        = isTop3 ? "14px" : "13px";

    let hash = 0;
    for(const c of p.nick) hash = (hash * 31 + c.charCodeAt(0)) >>> 0;
    const av = AVATAR_PALETTE[hash % AVATAR_PALETTE.length];

    const groupCell = isAll
      ? `<td style="${TD}${tdBg}"><span style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:6px;font-size:11px;font-weight:800;background:rgba(96,165,250,.1);color:#60a5fa;border:1px solid rgba(96,165,250,.18);">${p.group}</span></td>`
      : "";

    rowsHtml += `
      <tr>
        <td style="${TD}${tdBg}${firstBorder}text-align:center;font-size:${noFS};font-weight:600;color:${nameColor};">${medal || rank}</td>
        ${groupCell}
        <td style="${TD}${tdBg}">
          <div style="display:flex;align-items:center;gap:10px;">
            <div style="width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;background:${av.bg};border:1px solid ${av.border};color:${av.color};">${p.nick.trim().charAt(0).toUpperCase()}</div>
            <span style="font-weight:${nameFW};font-size:${nameFS};color:${nameColor};">${p.nick}</span>
          </div>
        </td>
        <td style="${TD}${tdBg}font-size:12px;font-weight:500;color:${teamColor};">${p.team}</td>
        <td style="${TD}${tdBg}text-align:center;">
          <span style="display:inline-flex;align-items:center;justify-content:center;min-width:34px;padding:3px 10px;border-radius:7px;font-size:${ptsFS};font-weight:800;background:${ptsBg};color:${ptsColor};border:1px solid ${ptsBorder};">${p.pts}</span>
        </td>
      </tr>`;
  });

  // assemble full node
  const wrap = document.createElement("div");
  wrap.style.cssText = "position:fixed;left:-9999px;top:0;";
  wrap.innerHTML = `
    <div id="export-root" style="width:760px;background:#07090f;padding:40px 36px 36px;font-family:'Inter','Segoe UI',system-ui,sans-serif;color:#f1f5f9;line-height:1.5;">

      <div style="display:flex;justify-content:flex-end;margin-bottom:10px;">
        <span style="font-size:11px;font-weight:500;color:#374151;letter-spacing:.3px;">https://bit.ly/mmpls9_mvp</span>
      </div>

      <div style="text-align:center;margin-bottom:28px;">
        <div style="display:inline-block;font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#f59e0b;border:1px solid rgba(245,158,11,.3);background:rgba(245,158,11,.08);padding:6px 18px;border-radius:100px;margin-bottom:12px;">MMPL Season 9</div>
        <div style="font-size:36px;font-weight:900;color:#f59e0b;letter-spacing:-1px;line-height:1.1;margin-bottom:6px;">MVP Leaderboard</div>
        <div style="font-size:11px;font-weight:500;color:#4b5563;letter-spacing:.4px;">${dateStr}&nbsp;&nbsp;|&nbsp;&nbsp;${timeStr}</div>
      </div>

      <div style="font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#374151;margin-bottom:8px;padding-left:2px;">${tabLabel}</div>

      <div style="background:#0d1525;border:1px solid rgba(255,255,255,.1);border-radius:16px;overflow:hidden;">
        <table style="width:100%;border-collapse:collapse;">
          <thead>
            <tr style="background:rgba(255,255,255,.04);">
              ${theadHtml}
            </tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
        <div style="padding:12px 18px;background:rgba(255,255,255,.03);border-top:1px solid rgba(255,255,255,.07);display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:11px;color:#374151;letter-spacing:.3px;">Generated ${dateStr}, ${timeStr}</span>
          <span style="font-size:11px;color:#374151;letter-spacing:.3px;">Powered by <span style="color:#f59e0b;font-weight:700;">Tigor M Manurung</span></span>
        </div>
      </div>

    </div>`;

  document.body.appendChild(wrap);
  return wrap;
}

// ── capture & download image ─────────────────────────────────────
const DOWNLOAD_ICON = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;
const CLOCK_ICON   = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>`;

document.getElementById("captureBtn").addEventListener("click", async function(){
  const btn = this;
  btn.disabled = true;
  btn.innerHTML = `${CLOCK_ICON} Capturing…`;

  await document.fonts.ready;
  await new Promise(r => setTimeout(r, 100));

  const exportWrap = buildExportNode();
  const exportRoot = exportWrap.querySelector("#export-root");

  try {
    const canvas = await html2canvas(exportRoot, {
      backgroundColor: "#07090f",
      scale: 2,
      useCORS: true,
      allowTaint: true,
      logging: false
    });

    const now = new Date();
    const stamp = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,"0")}${String(now.getDate()).padStart(2,"0")}_${String(now.getHours()).padStart(2,"0")}${String(now.getMinutes()).padStart(2,"0")}`;
    const link = document.createElement("a");
    link.download = `mvp-leaderboard-${stamp}.png`;
    link.href = canvas.toDataURL("image/png");
    link.click();
  } catch(e) {
    alert("Failed to capture. Please try again.");
  } finally {
    exportWrap.remove();
    btn.disabled = false;
    btn.innerHTML = `${DOWNLOAD_ICON} Download`;
  }
});
