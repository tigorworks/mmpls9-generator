<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MVP Input</title>

<style>
*{
  box-sizing:border-box; /* 🔥 ini penting biar width konsisten */
}

body{
  font-family:sans-serif;
  background:#0f172a;
  color:#fff;
  padding:30px;
}

.card{
  max-width:500px;
  margin:auto;
  background:#111827;
  padding:20px;
  border-radius:12px;
}

h3{
  margin-bottom:15px;
}

input, select, textarea, button{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border-radius:8px;
  border:1px solid #374151;
  background:#020617;
  color:#fff;
  font-size:14px;
}

/* 🔥 Samakan behavior input date */
input[type="date"]{
  appearance:none;
  -webkit-appearance:none;
}

/* textarea */
textarea{
  resize:vertical;
  min-height:80px;
}

/* select fix (arrow custom + spacing) */
select{
  padding-right:40px;
  appearance:none;
  -webkit-appearance:none;
  -moz-appearance:none;

  background-image:url("data:image/svg+xml;utf8,<svg fill='%239ca3af' height='20' viewBox='0 0 20 20' width='20' xmlns='http://www.w3.org/2000/svg'><path d='M5 7l5 5 5-5'/></svg>");
  background-repeat:no-repeat;
  background-position:right 12px center;
  background-size:16px;
}

button{
  background:#f59e0b;
  border:none;
  cursor:pointer;
}

button:disabled{
  background:#555;
  cursor:not-allowed;
}
</style>
</head>

<body>

<div class="card">

<h3>Input MVP</h3>

<input type="date" id="tanggal">

<select id="group">
  <option value="">Pilih Group</option>
</select>

<select id="match" disabled>
  <option value="">Pilih Match</option>
</select>

<select id="winner" disabled>
  <option value="">Pilih Winner</option>
</select>

<select id="mvpWinner" disabled>
  <option value="">MVP Winner</option>
</select>

<select id="mvpLoser" disabled>
  <option value="">MVP Loser</option>
</select>

<!-- 🔥 CATATAN -->
<textarea id="note" placeholder="Catatan (opsional)"></textarea>

<button id="submitBtn" disabled>Submit</button>

</div>

<script>

let data = {};
let matches = [];

const GROUP_MAP = {
  A:["LUCTARI","Panthera","Happy family","HUMBLE TEAM","Warteg Berkah Jaya","Crown X Sulawesi E-sport","BTRB","166 JKT","Dark Horse"],
  B:["Taoism","TBRN FURY","RX Squad","Royal One","ASPAL Reignite","170 PARES","Sikat Miring e-Sport","Aura Farming.PKU108","Gatsu E-sports"],
  C:["UNSTOPPABLE","Jujutsu IT","Kuningan x Priuk","MEGAKING : TUA","HELL GLORIOUS","MACHITIS","Gasspadia Squad","TBRN THUNDER","Royal One Klp"],
  D:["MEGAKING : ENDGAME","BGST","EJS REBORN","Thunder Redeb","Komodo Komando","TBRN RAVAGER","BANGJOS e Sport","Blackout Renegades","MBG Squad Region XII Papua","Wumbo Wumbo"]
};

document.getElementById("tanggal").value = new Date().toISOString().split('T')[0];

// load JSON
fetch("mmpl.json")
.then(r=>r.json())
.then(res=>{
  data = res;
  initGroup();
});

// init group
function initGroup(){
  let g = document.getElementById("group");

  Object.keys(GROUP_MAP).forEach(x=>{
    g.add(new Option("Group "+x,x));
  });

  g.onchange = onGroupChange;
}

// generate match
function genMatch(teams){
  let m=[];
  for(let i=0;i<teams.length;i++){
    for(let j=i+1;j<teams.length;j++){
      m.push({t1:teams[i],t2:teams[j]});
    }
  }
  return m;
}

// group change
function onGroupChange(){

  reset(["match","winner","mvpWinner","mvpLoser"]);

  let group = document.getElementById("group").value;
  if(!group) return;

  matches = genMatch(GROUP_MAP[group]);

  let el = document.getElementById("match");
  el.disabled=false;

  matches.forEach((m,i)=>{
    el.add(new Option(m.t1+" vs "+m.t2, i));
  });

  el.onchange = onMatchChange;
}

// match change
function onMatchChange(){

  reset(["winner","mvpWinner","mvpLoser"]);

  let idx = document.getElementById("match").value;
  if(idx==="") return;

  let m = matches[idx];

  let el = document.getElementById("winner");
  el.disabled=false;

  el.add(new Option(m.t1,m.t1));
  el.add(new Option(m.t2,m.t2));

  el.onchange = onWinnerChange;
}

// winner change
function onWinnerChange(){

  reset(["mvpWinner","mvpLoser"]);

  let idx = document.getElementById("match").value;
  let win = document.getElementById("winner").value;
  if(!win) return;

  let m = matches[idx];
  let lose = (win===m.t1)?m.t2:m.t1;

  fillPlayers("mvpWinner", win);
  fillPlayers("mvpLoser", lose);

  validate();
}

// fill player
function fillPlayers(id, team){

  let el = document.getElementById(id);
  el.disabled=false;

  let t = data.teams.find(x=>x.team_name===team);

  t.members.forEach(p=>{
    el.add(new Option(p.game_nick,p.game_nick));
  });

  el.onchange = validate;
}

// reset
function reset(ids){
  ids.forEach(id=>{
    let el = document.getElementById(id);
    el.innerHTML = '<option value="">Pilih</option>';
    el.disabled = true;
  });
}

// validate
function validate(){

  let valid =
    group.value &&
    match.value &&
    winner.value &&
    mvpWinner.value &&
    mvpLoser.value;

  document.getElementById("submitBtn").disabled = !valid;
}

// submit
document.getElementById("submitBtn").onclick=function(){

  let m = matches[match.value];

  console.log({
    tanggal:tanggal.value,
    group:group.value,
    match:m.t1+" vs "+m.t2,
    winner:winner.value,
    mvp_winner:mvpWinner.value,
    mvp_loser:mvpLoser.value,
    note:document.getElementById("note").value
  });

  alert("OK");
};

</script>

</body>
</html>
