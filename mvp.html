<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MVP Leaderboard</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gold:   #f59e0b;
  --silver: #cbd5e1;
  --bronze: #cd7f32;
  --blue:   #60a5fa;
  --dim:    #4b5563;
  --bright: #f1f5f9;
}

body {
  font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
  background: #07090f url('bg.png') center center / 63% auto no-repeat fixed;
  color: var(--bright);
  min-height: 100vh;
  padding: 48px 16px 72px;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: rgba(5,7,14,.78);
  pointer-events: none;
  z-index: 0;
}

.container {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 960px;
  margin: 0 auto;
  padding: 0 20px;
}

/* ── hero ── */
.hero {
  text-align: center;
  margin-bottom: 36px;
}

.hero-eyebrow {
  display: inline-block;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--gold);
  border: 1px solid rgba(245,158,11,.3);
  background: rgba(245,158,11,.06);
  padding: 7px 20px;
  border-radius: 100px;
  margin-bottom: 14px;
}

.hero h1 {
  font-size: clamp(28px, 5vw, 44px);
  font-weight: 900;
  letter-spacing: -1px;
  line-height: 1.05;
  background: linear-gradient(135deg, #ffffff 20%, #94a3b8 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.hero-sub {
  margin-top: 8px;
  font-size: 13px;
  color: #4b5563;
  letter-spacing: .3px;
}

/* ── tabs ── */
.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 16px;
  background: rgba(10,14,26,.6);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 12px;
  padding: 5px;
}

.tab {
  flex: 1;
  padding: 9px 10px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: transparent;
  color: #4b5563;
  font-size: 13px;
  font-weight: 600;
  font-family: inherit;
  letter-spacing: .3px;
  cursor: pointer;
  transition: background .15s, color .15s, border-color .15s;
  white-space: nowrap;
}

.tab:hover:not(.active) {
  background: rgba(255,255,255,.05);
  color: #94a3b8;
}

.tab.active {
  background: rgba(245,158,11,.12);
  color: var(--gold);
  border-color: rgba(245,158,11,.22);
}

/* ── glass panel ── */
.panel {
  background: rgba(10,14,26,.55);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 18px;
  overflow: hidden;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.03),
    0 32px 64px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(255,255,255,.05);
}

.table-scroll {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

/* ── table ── */
table { width: 100%; border-collapse: collapse; }

thead tr {
  background: rgba(255,255,255,.04);
  border-bottom: 1px solid rgba(255,255,255,.07);
}

thead th {
  padding: 14px 18px;
  text-align: left;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #4b5563;
  white-space: nowrap;
}

thead th:first-child { text-align: center; width: 56px; }
thead th:last-child  { text-align: center; }

tbody tr {
  border-bottom: 1px solid rgba(255,255,255,.05);
  transition: background .15s;
}

tbody tr:last-child { border-bottom: none; }

tbody tr:not(.rank-1):not(.rank-2):not(.rank-3):not(.divider-row):hover {
  background: rgba(255,255,255,.03);
}

tbody td {
  padding: 13px 18px;
  font-size: 14px;
  vertical-align: middle;
  color: var(--dim);
}

tbody td:first-child {
  text-align: center;
  font-size: 13px;
  font-weight: 600;
  color: var(--dim);
  width: 56px;
}

.badge-group {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 7px;
  font-size: 12px;
  font-weight: 800;
  background: rgba(96,165,250,.1);
  color: #60a5fa;
  border: 1px solid rgba(96,165,250,.18);
}

.team-name {
  font-size: 12px;
  font-weight: 500;
  color: var(--dim);
}

.player-cell {
  display: flex;
  align-items: center;
  gap: 10px;
}

.player-avatar {
  width: 30px;
  height: 30px;
  border-radius: 7px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.08);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--dim);
  flex-shrink: 0;
  text-transform: uppercase;
}

.player-name {
  font-weight: 600;
  font-size: 14px;
  color: var(--dim);
}

.pts {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 34px;
  padding: 3px 10px;
  border-radius: 7px;
  font-size: 13px;
  font-weight: 800;
  background: rgba(255,255,255,.05);
  color: #4b5563;
  border: 1px solid rgba(255,255,255,.08);
}

/* ── top 3 ── */
tbody tr.rank-1 {
  background: linear-gradient(90deg, rgba(245,158,11,.18) 0%, rgba(245,158,11,.05) 55%, transparent 100%);
  box-shadow: inset 4px 0 0 var(--gold);
}
tbody tr.rank-2 {
  background: linear-gradient(90deg, rgba(203,213,225,.14) 0%, rgba(203,213,225,.04) 55%, transparent 100%);
  box-shadow: inset 4px 0 0 var(--silver);
}
tbody tr.rank-3 {
  background: linear-gradient(90deg, rgba(205,127,50,.15) 0%, rgba(205,127,50,.04) 55%, transparent 100%);
  box-shadow: inset 4px 0 0 var(--bronze);
}

tbody tr.rank-1:hover { background: linear-gradient(90deg, rgba(245,158,11,.26) 0%, rgba(245,158,11,.08) 55%, transparent 100%); }
tbody tr.rank-2:hover { background: linear-gradient(90deg, rgba(203,213,225,.20) 0%, rgba(203,213,225,.06) 55%, transparent 100%); }
tbody tr.rank-3:hover { background: linear-gradient(90deg, rgba(205,127,50,.22) 0%, rgba(205,127,50,.06) 55%, transparent 100%); }

tbody tr.rank-1 td,
tbody tr.rank-2 td,
tbody tr.rank-3 td { font-size: 15px; color: var(--bright); }

tbody tr.rank-1 td:first-child,
tbody tr.rank-2 td:first-child,
tbody tr.rank-3 td:first-child { font-size: 16px; color: var(--bright); }

tbody tr.rank-1 .player-name,
tbody tr.rank-2 .player-name,
tbody tr.rank-3 .player-name { font-size: 16px; font-weight: 700; color: var(--bright); }

tbody tr.rank-1 .team-name,
tbody tr.rank-2 .team-name,
tbody tr.rank-3 .team-name { font-size: 13px; color: rgba(241,245,249,.65); }

tbody tr.rank-1 .player-avatar,
tbody tr.rank-2 .player-avatar,
tbody tr.rank-3 .player-avatar { color: var(--bright); background: rgba(255,255,255,.1); }

.rank-medal { font-size: 20px; line-height: 1; }

tbody tr.rank-1 .pts { background: rgba(245,158,11,.2);  border-color: rgba(245,158,11,.45); color: #fde68a; font-size: 14px; }
tbody tr.rank-2 .pts { background: rgba(203,213,225,.14); border-color: rgba(203,213,225,.35); color: #e2e8f0; font-size: 14px; }
tbody tr.rank-3 .pts { background: rgba(205,127,50,.18); border-color: rgba(205,127,50,.4);  color: #fcd9a0; font-size: 14px; }

/* ── divider top 10 ── */
.divider-row td {
  padding: 0 !important;
  height: 0;
  border-bottom: 1px dashed rgba(245,158,11,.2) !important;
}

/* ── state rows ── */
.state-row td {
  padding: 64px 20px;
  text-align: center;
  color: #4b5563;
}

.state-icon {
  font-size: 30px;
  display: block;
  margin-bottom: 10px;
  opacity: .35;
}

.state-label { font-size: 14px; }

.spinner {
  width: 26px;
  height: 26px;
  border: 2px solid rgba(255,255,255,.08);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  margin: 0 auto 10px;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ── footer ── */
.footer-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 18px;
  background: rgba(255,255,255,.03);
  border-top: 1px solid rgba(255,255,255,.06);
  gap: 12px;
}

.last-update {
  font-size: 11px;
  color: #374151;
  letter-spacing: .3px;
}

.refresh-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,.1);
  background: rgba(255,255,255,.04);
  color: #4b5563;
  font-size: 11px;
  font-weight: 600;
  font-family: inherit;
  letter-spacing: .3px;
  cursor: pointer;
  transition: background .15s, color .15s, border-color .15s;
  white-space: nowrap;
}

.refresh-btn:hover {
  background: rgba(255,255,255,.08);
  color: var(--bright);
  border-color: rgba(255,255,255,.18);
}

.refresh-btn svg { flex-shrink: 0; }

</style>
</head>

<body>
<div class="container">

  <div class="hero">
    <span class="hero-eyebrow">MMPL Season 9</span>
    <h1>MVP Leaderboard</h1>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="all">All</button>
    <button class="tab" data-tab="A">Group A</button>
    <button class="tab" data-tab="B">Group B</button>
    <button class="tab" data-tab="C">Group C</button>
    <button class="tab" data-tab="D">Group D</button>
  </div>

  <div class="panel">
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>Group</th>
            <th>Tim</th>
            <th>Nama Player</th>
            <th style="text-align:center">Poin</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr class="state-row">
            <td colspan="5">
              <div class="spinner"></div>
              <span class="state-label">Memuat data...</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="footer-bar">
      <span class="last-update" id="lastUpdate"></span>
    </div>
  </div>

</div>

<script>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxXcrSvLxCGpM5zgTYE6jyf6DSGJ3VP-F1eo8se235t39liUXyB6q--zNZE2T8UpNl4DA/exec";
const MEDALS = ["🥇","🥈","🥉"];

let allRanked = [];
let activeTab = "all";

function loadData(){
  showLoading();
  fetch(SCRIPT_URL)
    .then(r => { if(!r.ok) throw new Error(); return r.json(); })
    .then(parsed => {
      const rows = Array.isArray(parsed) ? parsed : (parsed.data || []);
      processData(rows, parsed.lastUpdate || "");
    })
    .catch(() => showError());
}

function processData(rows, lastUpdate){
  const players = {};

  rows.forEach(r => {
    const group     = r["Group"]            || "-";
    const match     = r["Match"]            || "";
    const winner    = r["Winner"]           || "-";
    const nickW     = (r["MVP Winner Nick"] || "").trim();
    const nickL     = (r["MVP Loser Nick"]  || "").trim();
    const parts     = match.split(/\s+vs\s+/i);
    const loserTeam = parts.find(t => t.trim() !== winner.trim()) || "-";

    if(nickW){
      if(!players[nickW]) players[nickW] = { nick: nickW, group, team: winner, pts: 0 };
      players[nickW].pts += 2;
    }
    if(nickL){
      if(!players[nickL]) players[nickL] = { nick: nickL, group, team: loserTeam, pts: 0 };
      players[nickL].pts += 1;
    }
  });

  allRanked = Object.values(players).sort((a, b) =>
    b.pts !== a.pts ? b.pts - a.pts : a.nick.localeCompare(b.nick)
  );

  document.getElementById("lastUpdate").textContent =
    lastUpdate ? "Update terakhir: " + lastUpdate : "";

  renderTab(activeTab);
}

function renderTab(tab){
  activeTab = tab;
  const isAll = tab === "all";

  // filter per group, re-rank within group
  const list = isAll
    ? allRanked
    : allRanked.filter(p => p.group === tab);

  if(!list.length){ showEmpty(); return; }

  const tbody = document.getElementById("tbody");
  let html = "";

  list.forEach((p, i) => {
    const rank   = i + 1;
    const isTop3 = rank <= 3;
    const medal  = MEDALS[i] || "";
    const cls    = isTop3 ? ` class="rank-${rank}"` : "";
    const noCell = medal ? `<span class="rank-medal">${medal}</span>` : rank;

    // dashed divider after top 10 on All tab
    if(isAll && rank === 11){
      html += `<tr class="divider-row"><td colspan="5"></td></tr>`;
    }

    html += `<tr${cls}>
      <td>${noCell}</td>
      <td><span class="badge-group">${p.group}</span></td>
      <td><span class="team-name">${p.team}</span></td>
      <td>
        <div class="player-cell">
          <div class="player-avatar">${initials(p.nick)}</div>
          <span class="player-name">${p.nick}</span>
        </div>
      </td>
      <td style="text-align:center"><span class="pts">${p.pts}</span></td>
    </tr>`;
  });

  tbody.innerHTML = html;
}

document.getElementById("tabs").addEventListener("click", e => {
  const btn = e.target.closest(".tab");
  if(!btn) return;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  btn.classList.add("active");
  allRanked.length ? renderTab(btn.dataset.tab) : (activeTab = btn.dataset.tab);
});

function initials(name){ return name ? name.trim().charAt(0).toUpperCase() : "?"; }

function showLoading(){
  document.getElementById("tbody").innerHTML = `
    <tr class="state-row"><td colspan="5">
      <div class="spinner"></div>
      <span class="state-label">Memuat data...</span>
    </td></tr>`;
}

function showError(){
  document.getElementById("tbody").innerHTML = `
    <tr class="state-row"><td colspan="5">
      <span class="state-icon">⚠</span>
      <span class="state-label">Gagal memuat data. Coba refresh.</span>
    </td></tr>`;
}

function showEmpty(){
  document.getElementById("tbody").innerHTML = `
    <tr class="state-row"><td colspan="5">
      <span class="state-icon">🏆</span>
      <span class="state-label">Belum ada data MVP.</span>
    </td></tr>`;
}

loadData();

</script>
</body>
</html>
